<!DOCTYPE html>
<script>
  var params = new URLSearchParams(window.location.search);
  var id = params.get("id");
  var destino = "https://www.instagram.com/golff.evolution/";
  var api = "https://script.google.com/macros/s/AKfycbxlwmruqdRHG_ivkq8T-rzt_iVnBvqcClyz6vS8xvC7UR1gwIKNGapPePrMcY36REY/exec?id=" + encodeURIComponent(id);
  fetch(api).then(function(r){return r.json();}).then(function(data){
    if (data && data.destino) { destino = data.destino; }
    window.location.href = destino;
  }).catch(function(){ window.location.href = destino; });
  
</script>
